name: Iterative Health
description: 'Iterative Health is a Boston-based clinical research and healthcare technology company
  operating a global network of community-based clinical research sites that connect trial sponsors with
  providers to accelerate enrollment and expand patient access to investigational therapies. Its
  therapeutic focus spans gastroenterology, hepatology, obesity, and cardiology, and its SKOUT AI
  tooling (rooted in the company''s computer-vision work in GI endoscopy) helps sites and sponsors run
  research more efficiently. Backed by GV and Obvious Ventures and funded through a $77M Series C, the
  company partners with provider networks including GI Alliance, One GI, and US Heart & Vascular. As of
  this enrichment pass Iterative Health publishes no public developer API, documentation, or developer
  portal; this profile captures its public company identity and domain-security posture only.'
